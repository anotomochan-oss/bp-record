<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>血圧記録</title>
<!-- ホーム画面に追加したときの名前・アイコン・全画面表示 -->
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="血圧記録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  /* ===== 色（ライト） ===== */
  :root {
    --bg: #f2f4f7; --card: #fff; --text: #1f2328; --sub: #5f6368; --line: #e1e4e8; --field: #f3f5f8;
    --primary: #1a73e8; --primary-2: #12a4b8;
    --sys: #1a73e8; --dia: #12a4b8; --pulse: #9aa0a6;
    --ok-bg: #e6f4ea; --ok: #137333;
    --warn-bg: #fef7e0; --warn: #b06000; --warn-mark: #f9ab00;
    --danger-bg: #fce8e6; --danger: #c5221f; --danger-mark: #d93025;
    --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 14px rgba(0, 0, 0, .05);
    --nav-h: 58px;
  }
  /* ===== 色（ダーク）。印刷は常にライトになるよう screen に限定 ===== */
  @media screen and (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d23; --text: #e8eaed; --sub: #9aa0a6; --line: #2e333b; --field: #252930;
      --sys: #6aa8ff; --dia: #3cc7d6; --pulse: #7d838b;
      --ok-bg: #16301f; --ok: #81c995;
      --warn-bg: #3a2e10; --warn: #fdd663;
      --danger-bg: #3d1a18; --danger: #f28b82;
      --shadow: none;
    }
  }

  /* ===== 基本 ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .label { color: var(--sub); font-size: 12px; }
  .empty { text-align: center; color: var(--sub); padding: 32px 0; }
  .error { color: var(--danger); font-size: 14px; margin-top: 10px; }

  /* ===== ヘッダー（アイコンと同じ色の帯） ===== */
  .hero { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: calc(env(safe-area-inset-top) + 16px) 20px 46px; }
  .hero-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 520px; margin: 0 auto; }
  .hero h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .hero p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  .who { position: relative; display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 14px; white-space: nowrap; }
  .who .i { width: 18px; height: 18px; }
  .who select { position: absolute; inset: 0; width: 100%; opacity: 0; font-size: 16px; }

  /* ===== 本体・カード ===== */
  main { max-width: 520px; margin: -30px auto 0; padding: 0 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== ボタン・入力欄 ===== */
  .primary { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #1f86d6); color: #fff; transition: transform .1s, opacity .2s; }
  .primary:active { transform: scale(.97); }
  .primary:disabled { opacity: .5; }
  .namebtn { margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 7px 14px; border-radius: 999px; border: none; background: var(--field); color: var(--sub); font-size: 14px; transition: background .15s, color .15s, transform .1s; }
  .chip:active { transform: scale(.95); }
  .chip.active { background: var(--primary); color: #fff; }
  .link { background: none; border: none; color: var(--primary); font-size: 13px; padding: 0; }
  .field { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); }
  .range { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

  /* ===== 今日の状況 ===== */
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 999px; font-size: 12px; margin-top: 4px; white-space: nowrap; }
  .pill .i { width: 14px; height: 14px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.danger { background: var(--danger-bg); color: var(--danger); }
  .pill.mute { background: var(--field); color: var(--sub); }
  .streak { font-size: 22px; font-weight: 700; }
  .streak small { font-size: 13px; font-weight: 400; color: var(--sub); }

  /* ===== 数字入力 ===== */
  .when { display: flex; justify-content: space-between; align-items: center; }
  .bp { display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin: 14px 0 8px; }
  .bp .col { text-align: center; }
  .bp input { width: 92px; font-size: 42px; font-weight: 700; text-align: center; border: none; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; color: var(--text); padding: 2px 0; font-variant-numeric: tabular-nums; transition: border-color .15s; }
  .bp input:focus { outline: none; border-bottom-color: var(--primary); }
  .bp input.small { width: 60px; font-size: 24px; }
  .bp input::placeholder { color: var(--line); font-size: 14px; font-weight: 400; }
  .bp .slash { font-size: 36px; color: var(--sub); padding-bottom: 8px; }
  .bp .pcol { margin-left: 10px; }
  .memo { margin: 8px 0 14px; }

  /* ===== 登録結果 ===== */
  .result { display: flex; gap: 12px; align-items: center; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  .result .i { width: 36px; height: 36px; }
  .result b { display: block; font-size: 16px; }
  .result span { font-size: 13px; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result.danger { background: var(--danger-bg); color: var(--danger); }

  /* ===== 最近の記録 ===== */
  .recent { list-style: none; margin: 4px 0 0; padding: 0; }
  .recent li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .recent li:last-child { border-bottom: none; }
  .recent .dt { color: var(--sub); font-size: 13px; width: 96px; }
  .recent .val { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .recent .pl { color: var(--sub); font-size: 13px; }
  .recent .mm { color: var(--sub); font-size: 12px; flex-basis: 100%; padding-left: 124px; margin-top: -6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.lv1 { background: var(--warn-mark); }
  .dot.lv2 { background: var(--danger-mark); }

  /* ===== グラフ ===== */
  .avgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .avgs > div { padding: 6px; border-radius: 10px; }
  .avgs > div.sel { background: var(--field); }
  .avgs .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .avgs .v small { font-size: 14px; }
  .chart-box { position: relative; height: 300px; }

  /* ===== 下部タブバー ===== */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .nav button { flex: 1; height: var(--nav-h); background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--sub); transition: color .15s; }
  .nav button.active { color: var(--primary); }

  /* ===== レポート ===== */
  .report { font-size: 13px; }
  .rp-head { display: flex; justify-content: space-between; align-items: baseline; }
  .rp-head b { font-size: 18px; }
  .rp-head span, .rp-sub, .rp-note { color: var(--sub); }
  .rp-sub { margin: 2px 0 10px; }
  .rp-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
  .rp-table th, .rp-table td { border: 1px solid var(--line); padding: 4px 5px; text-align: center; }
  .rp-table th { background: var(--field); font-weight: normal; color: var(--sub); }
  .rp-table td.memo { text-align: left; }
  .report .lv1 { background: var(--warn-bg); }
  .report .lv2 { background: var(--danger-bg); }
  .rp-chart { display: block; width: 100%; height: auto; margin-bottom: 10px; border-radius: 8px; background: #fff; }
  .rp-note { font-size: 12px; line-height: 1.6; }
  .rp-note span { padding: 0 4px; }

  /* iPhoneの「視差効果を減らす」がオンなら動きを止める */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* 印刷するときはレポートだけを出す */
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff; }
    .hero, .nav, .no-print { display: none !important; }
    main { max-width: none; margin: 0; padding: 0; }
    .card.report { padding: 0; margin: 0; border-radius: 0; box-shadow: none; }
    .rp-table tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-row">
    <div>
      <h1 id="heroTitle">血圧記録</h1>
      <p id="heroSub">家庭血圧の記録</p>
    </div>
    <label id="who" class="who hidden">
      <span data-icon="user"></span><span id="whoName"></span>
      <select id="nameSelect" aria-label="記録する人"></select>
    </label>
  </div>
</header>

<main>
  <!-- 読み込み中 -->
  <div id="screenLoading" class="card empty">読み込み中…</div>

  <!-- 暗証番号の入力（初回のみ） -->
  <div id="screenPass" class="card hidden">
    <p style="margin-top:0">暗証番号を入力してください</p>
    <input id="passInput" class="field" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password">
    <button id="passButton" class="primary" style="margin-top:12px">次へ</button>
    <div id="passMsg" class="error hidden"></div>
  </div>

  <!-- 名前の選択（初回のみ） -->
  <div id="screenName" class="card hidden">
    <p style="margin-top:0">あなたの名前を選んでください</p>
    <div id="nameButtons"></div>
  </div>

  <!-- メイン画面 -->
  <div id="screenMain" class="hidden">

    <!-- 記録タブ -->
    <div id="tabInput">
      <div class="card status">
        <div><div class="label">今日の朝</div><div id="statusMorning"></div></div>
        <div><div class="label">今日の夜</div><div id="statusNight"></div></div>
        <div><div class="label">連続記録</div><div class="streak" id="streak">-</div></div>
      </div>

      <div class="card">
        <div class="when">
          <span class="label" id="whenText"></span>
          <button class="link" id="whenToggle">日時を変更</button>
        </div>
        <div id="whenEdit" class="hidden" style="margin-top:10px">
          <input id="measuredAt" class="field" type="datetime-local" aria-label="測定日時">
          <div class="chips" id="catSeg" style="margin-top:8px">
            <button class="chip" data-cat="朝">朝</button>
            <button class="chip" data-cat="夜">夜</button>
          </div>
        </div>
        <div class="bp">
          <div class="col"><label class="label" for="sys">最高</label><br><input id="sys" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
          <div class="slash">/</div>
          <div class="col"><label class="label" for="dia">最低</label><br><input id="dia" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>
          <div class="col pcol"><label class="label" for="pulse">脈拍</label><br><input id="pulse" class="small" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="任意"></div>
        </div>
        <input id="memo" class="field memo" type="text" maxlength="100" placeholder="メモ（任意）例：寝不足">
        <button id="submitButton" class="primary">登録する</button>
        <div id="submitError" class="error hidden"></div>
      </div>

      <div id="result" class="card result hidden" role="status"></div>

      <div class="card">
        <div class="label">最近の記録</div>
        <ul id="recentList" class="recent"></ul>
      </div>
    </div>

    <!-- グラフタブ -->
    <div id="tabChart" class="hidden">
      <div class="card">
        <select id="chartPerson" class="field" aria-label="表示する人"></select>
        <div class="chips" id="daysSeg" style="margin-top:10px">
          <button class="chip active" data-days="7">1週間</button>
          <button class="chip" data-days="30">1か月</button>
          <button class="chip" data-days="90">3か月</button>
        </div>
        <div class="chips" id="chartCatSeg" style="margin-top:8px">
          <button class="chip active" data-cat="all">朝と夜</button>
          <button class="chip" data-cat="朝">朝のみ</button>
          <button class="chip" data-cat="夜">夜のみ</button>
        </div>
      </div>
      <div class="card">
        <div class="avgs" id="avgs"></div>
        <div class="label" id="avgFoot" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <div class="chart-box"><canvas id="chart"></canvas></div>
        <div id="chartEmpty" class="empty hidden">この期間の記録はありません</div>
      </div>
    </div>

    <!-- レポートタブ（医師に見せる用） -->
    <div id="tabReport" class="hidden">
      <div class="card no-print">
        <select id="reportPerson" class="field" aria-label="表示する人"></select>
        <div class="chips" id="reportSeg" style="margin-top:10px">
          <button class="chip" data-range="14">2週間</button>
          <button class="chip active" data-range="30">1か月</button>
          <button class="chip" data-range="90">3か月</button>
          <button class="chip" data-range="custom">指定</button>
        </div>
        <div id="customRange" class="range hidden">
          <input id="reportFrom" class="field" type="date" aria-label="開始日">
          <span>〜</span>
          <input id="reportTo" class="field" type="date" aria-label="終了日">
        </div>
        <button id="printButton" class="primary" style="margin-top:12px">印刷・PDFで保存</button>
      </div>
      <div id="report" class="card report"></div>
    </div>
  </div>
</main>

<nav id="nav" class="nav hidden">
  <button data-tab="Input" class="active"><span data-icon="pencil"></span>記録</button>
  <button data-tab="Chart"><span data-icon="chart"></span>グラフ</button>
  <button data-tab="Report"><span data-icon="file"></span>レポート</button>
</nav>

<script>
  // ===== データ担当（GAS）のURL：デプロイしたウェブアプリのURLに書き換える =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbxnD0JHhgeQi3GyYNb0QUVMk6sT1edyCpgNiFH8TCQIAu2yhjSn5iC_J35rKylvqZT2/exec';

  // ===== アイコン（線画のSVG。外部ファイルを読まないので軽い） =====
  const ICONS = {
    pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
    chart: '<path d="M4 19h16"/><path d="M4 15l4-6 4 3 4-7 4 5"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
    alert: '<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17v.01"/>',
  };
  const icon = (name) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
  document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = icon(el.dataset.icon); });

  // ===== 端末への保存（使えない環境でも動くようにする） =====
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    remove(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  const $ = (id) => document.getElementById(id);
  let pass = store.get('bp_pass') || '';
  let config = null;        // サーバの設定値（利用者名・基準値など）
  let currentName = '';     // 記録する人
  let currentTab = 'Input';
  const cache = {};         // 名前 → 直近の記録
  const chartState = { days: 7, cat: 'all' };
  let chart = null;
  let catManual = false;    // 朝/夜を手動で選んだか

  const PERIOD_LABEL = { 7: '1週間', 30: '1か月', 90: '3か月' };
  const PREV_LABEL = { 7: '前週比', 30: '前月比', 90: '前3か月比' };
  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  // GASを呼ぶ（暗証番号を自動で付ける）
  // Content-Type を付けない（text/plain になる）ことで、ブラウザの事前確認なしにGASへ送れる
  async function call(action, params) {
    let json;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(Object.assign({ action, pin: pass }, params)),
      });
      json = await res.json();
    } catch (e) {
      throw new Error('通信できませんでした。電波の状態を確認してください');
    }
    if (!json.ok) {
      const err = new Error(json.error);
      err.code = json.code;
      throw err;
    }
    return json.data;
  }

  function show(screen) {
    ['screenLoading', 'screenPass', 'screenName', 'screenMain'].forEach((id) => $(id).classList.toggle('hidden', id !== screen));
  }

  // アニメーションを最初から再生し直す
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  // ===== 起動 =====
  async function init() {
    if (!pass) return showPass();
    show('screenLoading');
    try {
      config = await call('getConfig');
    } catch (e) {
      if (e.code === 'BAD_PIN') {
        pass = '';
        store.remove('bp_pass');
      }
      return showPass(e.message);
    }
    const saved = store.get('bp_name');
    if (config.users.includes(saved)) startMain(saved);
    else showNameSelect();
  }

  function showPass(error) {
    show('screenPass');
    $('passMsg').classList.toggle('hidden', !error);
    if (error) $('passMsg').textContent = error;
    $('passInput').focus();
  }

  $('passButton').addEventListener('click', () => {
    const pin = $('passInput').value.trim();
    if (!/^[0-9]{4,8}$/.test(pin)) return showPass('暗証番号は4〜8桁の数字で入力してください');
    pass = pin;
    store.set('bp_pass', pass);
    init();
  });
  $('passInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('passButton').click(); });

  function showNameSelect() {
    show('screenName');
    const box = $('nameButtons');
    box.innerHTML = '';
    config.users.forEach((name) => {
      const b = document.createElement('button');
      b.className = 'primary namebtn';
      b.textContent = name;
      b.addEventListener('click', () => startMain(name));
      box.appendChild(b);
    });
  }

  function fillSelect(select, value) {
    select.innerHTML = '';
    config.users.forEach((name) => {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      select.appendChild(o);
    });
    select.value = value;
  }

  function startMain(name) {
    ['nameSelect', 'chartPerson', 'reportPerson'].forEach((id) => fillSelect($(id), name));
    setName(name);
    $('who').classList.remove('hidden');
    $('nav').classList.remove('hidden');
    show('screenMain');
    resetForm();
    switchTab('Input');
    $('sys').focus();
  }

  function setName(name) {
    currentName = name;
    store.set('bp_name', name);
    $('whoName').textContent = name;
    updateHero();
    loadRecent();
  }

  $('nameSelect').addEventListener('change', (e) => {
    setName(e.target.value);
    $('chartPerson').value = e.target.value;
    $('reportPerson').value = e.target.value;
    if (currentTab === 'Chart') renderChart();
    if (currentTab === 'Report') renderReport();
  });

  // ===== タブ切り替え・ヘッダー =====
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    ['Input', 'Chart', 'Report'].forEach((t) => $('tab' + t).classList.toggle('hidden', t !== tab));
    replay($('tab' + tab), 'fade');
    window.scrollTo(0, 0);
    updateHero();
    if (tab === 'Chart') renderChart();
    if (tab === 'Report') renderReport();
  }
  document.querySelectorAll('#nav button').forEach((b) => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  function updateHero() {
    if (!currentName) return;
    const now = new Date();
    if (currentTab === 'Input') {
      const h = now.getHours();
      const greet = h >= 4 && h < 11 ? 'おはようございます' : h < 18 && h >= 11 ? 'こんにちは' : 'こんばんは';
      $('heroTitle').textContent = greet + '、' + currentName + 'さん';
      $('heroSub').textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WEEKDAYS[now.getDay()] + '）';
    } else if (currentTab === 'Chart') {
      $('heroTitle').textContent = '推移';
      $('heroSub').textContent = $('chartPerson').value + ' ・ 直近' + PERIOD_LABEL[chartState.days];
    } else {
      $('heroTitle').textContent = 'レポート';
      $('heroSub').textContent = '医師に見せる用の記録表';
    }
  }

  // ===== 共通の計算 =====
  // 0:正常 1:注意 2:強い注意
  function level(sys, dia) {
    if (sys >= config.danger.sys || dia >= config.danger.dia) return 2;
    if (sys >= config.warn.sys || dia >= config.warn.dia) return 1;
    return 0;
  }

  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const slash = (s) => s.replace(/-/g, '/');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toLocalInput(d) {
    return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function catOf(value) {
    const hour = Number((value || '').slice(11, 13));
    return hour < config.boundaryHour ? '朝' : '夜';
  }

  function average(values) {
    const v = values.filter((x) => x !== null);
    return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : '-';
  }

  async function getRecordsFor(name) {
    if (!cache[name]) cache[name] = await call('getRecords', { name });
    return cache[name];
  }

  // ===== 記録タブ =====
  function setCat(cat) {
    $('catSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.cat === cat));
    updateWhen();
  }
  function getCat() {
    const b = $('catSeg').querySelector('button.active');
    return b ? b.dataset.cat : '';
  }

  function updateWhen() {
    const v = $('measuredAt').value;
    $('whenText').textContent = v ? slash(v.slice(5, 10)) + ' ' + v.slice(11, 16) + ' ・ ' + getCat() : '';
  }

  function resetForm() {
    $('measuredAt').value = toLocalInput(new Date());
    catManual = false;
    setCat(catOf($('measuredAt').value));
    $('whenEdit').classList.add('hidden');
    $('whenToggle').textContent = '日時を変更';
    ['sys', 'dia', 'pulse', 'memo'].forEach((id) => { $(id).value = ''; });
  }

  $('whenToggle').addEventListener('click', () => {
    const open = $('whenEdit').classList.toggle('hidden') === false;
    $('whenToggle').textContent = open ? '閉じる' : '日時を変更';
  });

  // 日時を変えたら朝/夜も自動で合わせる（手動で選んだ後は変えない）
  $('measuredAt').addEventListener('change', () => {
    if (!catManual) setCat(catOf($('measuredAt').value));
    else updateWhen();
  });
  $('catSeg').addEventListener('click', (e) => {
    if (!e.target.dataset.cat) return;
    catManual = true;
    setCat(e.target.dataset.cat);
  });

  // 数字を打ち終わったら次の欄へ自動で移る
  // （もう1桁足すと上限を超える＝入力が終わったとみなす）
  const numFields = ['sys', 'dia', 'pulse'];
  numFields.forEach((id, i) => {
    $(id).addEventListener('input', (e) => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = v;
      if (v && Number(v) * 10 > config.range[id].max) {
        const next = numFields[i + 1];
        if (next) $(next).focus();
        else e.target.blur();
      }
    });
  });

  function checkInput(input) {
    const labels = { sys: '最高血圧', dia: '最低血圧', pulse: '脈拍' };
    for (const id of numFields) {
      const v = input[id];
      if (v === '') {
        if (id === 'pulse') continue;
        return labels[id] + 'を入力してください';
      }
      const r = config.range[id];
      if (Number(v) < r.min || Number(v) > r.max) return labels[id] + 'は ' + r.min + '〜' + r.max + ' で入力してください';
    }
    if (Number(input.sys) <= Number(input.dia)) return '最高血圧は最低血圧より大きい値にしてください';
    return '';
  }

  $('submitButton').addEventListener('click', async () => {
    const input = {
      name: currentName,
      measuredAt: $('measuredAt').value.slice(0, 16),
      cat: getCat(),
      sys: $('sys').value,
      dia: $('dia').value,
      pulse: $('pulse').value,
      memo: $('memo').value,
    };
    const error = checkInput(input);
    $('submitError').classList.toggle('hidden', !error);
    if (error) return ($('submitError').textContent = error);

    $('submitButton').disabled = true;
    $('submitButton').textContent = '登録中…';
    try {
      await call('addRecord', { record: input });
      showResult(Number(input.sys), Number(input.dia));
      delete cache[currentName];
      resetForm();
      loadRecent();
    } catch (e) {
      $('submitError').textContent = '登録できませんでした：' + e.message;
      $('submitError').classList.remove('hidden');
    } finally {
      $('submitButton').disabled = false;
      $('submitButton').textContent = '登録する';
    }
  });

  function showResult(sys, dia) {
    const lv = level(sys, dia);
    const sub = [
      '正常範囲です',
      '注意：基準（' + config.warn.sys + '/' + config.warn.dia + '）以上です',
      '高い値です（' + config.danger.sys + '/' + config.danger.dia + '以上）。続くようなら医師に相談してください',
    ][lv];
    const el = $('result');
    el.className = 'card result ' + ['ok', 'warn', 'danger'][lv];
    el.innerHTML = icon(lv ? 'alert' : 'check') + '<div><b>登録しました（' + sys + '/' + dia + '）</b><span>' + sub + '</span></div>';
    replay(el, 'result');
  }

  function statusPill(done) {
    return done ? '<span class="pill ok">' + icon('check') + '記録済み</span>' : '<span class="pill mute">まだ</span>';
  }

  // 今日の朝・夜の記録状況と、連続で記録している日数
  function renderStatus(recs) {
    const today = slash(ymd(new Date()));
    const todays = recs.filter((r) => r.dt.startsWith(today));
    $('statusMorning').innerHTML = statusPill(todays.some((r) => r.cat === '朝'));
    $('statusNight').innerHTML = statusPill(todays.some((r) => r.cat === '夜'));

    // 今日（まだ記録がなければ昨日）からさかのぼって、記録のある日が続いている日数
    const days = new Set(recs.map((r) => r.dt.slice(0, 10)));
    const d = new Date();
    if (!days.has(today)) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(slash(ymd(d)))) {
      n++;
      d.setDate(d.getDate() - 1);
    }
    $('streak').innerHTML = n + '<small>日</small>';
  }

  async function loadRecent() {
    const list = $('recentList');
    list.innerHTML = '<li class="label">読み込み中…</li>';
    try {
      const all = await getRecordsFor(currentName);
      renderStatus(all);
      const recs = all.slice(-5).reverse();
      list.innerHTML = recs.length ? recs.map((r) => '<li>'
        + '<span class="dot lv' + level(r.sys, r.dia) + '"></span>'
        + '<span class="dt">' + r.dt.slice(5) + ' ' + r.cat + '</span>'
        + '<span class="val">' + r.sys + '/' + r.dia + '</span>'
        + (r.pulse ? '<span class="pl">脈 ' + r.pulse + '</span>' : '')
        + (r.memo ? '<span class="mm">' + esc(r.memo) + '</span>' : '')
        + '</li>').join('') : '<li class="label">まだ記録がありません</li>';
    } catch (e) {
      list.innerHTML = '<li class="label">読み込めませんでした：' + esc(e.message) + '</li>';
    }
  }

  // ===== グラフタブ =====
  function chipHandler(segId, key, parse) {
    $(segId).addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $(segId).querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
      chartState[key] = parse(b.dataset[key]);
      renderChart();
    });
  }
  chipHandler('daysSeg', 'days', Number);
  chipHandler('chartCatSeg', 'cat', String);
  $('chartPerson').addEventListener('change', renderChart);

  // days 日間の期間の始まり（offset 日だけ前にずらせる）
  function periodStart(days, offset) {
    const d = new Date();
    d.setDate(d.getDate() - (days - 1) - (offset || 0));
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  async function renderChart() {
    updateHero();
    const name = $('chartPerson').value;
    let all;
    try {
      all = await getRecordsFor(name);
    } catch (e) {
      $('chartEmpty').textContent = '読み込めませんでした：' + e.message;
      $('chartEmpty').classList.remove('hidden');
      return;
    }

    const days = chartState.days;
    const since = periodStart(days);
    const prevSince = periodStart(days, days);
    const cur = all.filter((r) => r.t >= since);
    const prev = all.filter((r) => r.t >= prevSince && r.t < since);
    const byCat = (cat) => (r) => cat === 'all' || r.cat === cat;

    // 朝・夜・全体の平均と、前の期間との差（最高血圧）
    $('avgs').innerHTML = [['朝', '朝の平均'], ['夜', '夜の平均'], ['all', '全体']].map(([cat, label]) => {
      const c = cur.filter(byCat(cat));
      const sys = average(c.map((r) => r.sys));
      const dia = average(c.map((r) => r.dia));
      const prevSys = average(prev.filter(byCat(cat)).map((r) => r.sys));
      let pill = '';
      if (sys !== '-' && prevSys !== '-') {
        const diff = sys - prevSys;
        pill = '<span class="pill ' + (diff > 0 ? 'warn' : diff < 0 ? 'ok' : 'mute') + '">'
          + PREV_LABEL[days] + ' ' + (diff > 0 ? '+' : diff < 0 ? '−' : '±') + Math.abs(diff) + '</span>';
      }
      return '<div class="' + (chartState.cat === cat ? 'sel' : '') + '"><div class="label">' + label + '</div>'
        + '<div class="v">' + sys + '<small>/' + dia + '</small></div>' + pill + '</div>';
    }).join('');

    const list = cur.filter(byCat(chartState.cat));
    $('avgFoot').textContent = '脈拍の平均 ' + average(list.map((r) => r.pulse)) + ' ・ 記録 ' + list.length + '件';

    if (chart) { chart.destroy(); chart = null; }
    $('chartEmpty').textContent = 'この期間の記録はありません';
    $('chartEmpty').classList.toggle('hidden', list.length > 0);
    $('chart').parentElement.classList.toggle('hidden', list.length === 0);
    if (!list.length) return;

    chart = new Chart($('chart'), chartConfig(list, chartState.cat === 'all'));
  }

  // 基準を超える範囲を薄く塗る（最高血圧：黄・赤、最低血圧：黄）
  const zonePlugin = {
    id: 'zones',
    beforeDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { y } } = c;
      const band = (from, to, color) => {
        const top = y.getPixelForValue(Math.min(to, y.max));
        const bottom = y.getPixelForValue(Math.max(from, y.min));
        if (bottom <= top) return;
        ctx.fillStyle = color;
        ctx.fillRect(a.left, top, a.right - a.left, bottom - top);
      };
      ctx.save();
      band(config.warn.sys, config.danger.sys, 'rgba(249, 171, 0, .13)');
      band(config.danger.sys, y.max, 'rgba(217, 48, 37, .10)');
      band(config.warn.dia, config.danger.dia, 'rgba(249, 171, 0, .13)');
      ctx.restore();
    },
  };

  // グラフの設定（グラフタブとレポートで共通）。withCat：横軸の日付に朝/夜を付けるか
  function chartConfig(list, withCat) {
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue('--' + name).trim();
    // 基準を超えた点だけ色を変えて大きくする（件数が多いときは点を小さくする）
    const dense = list.length > 40;
    const markColor = (v, warn, danger, base) => (v >= danger ? color('danger-mark') : v >= warn ? color('warn-mark') : base);
    const markSize = (v, warn) => (v >= warn ? (dense ? 3.5 : 6) : (dense ? 0 : 3));

    const labels = list.map((r) => r.dt.slice(5, 10) + (withCat ? r.cat : ''));
    const line = (label, data, c, extra) => Object.assign({
      label, data, borderColor: c, backgroundColor: c, borderWidth: 2.5, pointRadius: 3, tension: 0.3, spanGaps: true,
    }, extra);
    const baseLine = (label, value, c) => line(label, list.map(() => value), c, {
      borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, pointHoverRadius: 0, tension: 0,
    });

    return {
      type: 'line',
      plugins: [zonePlugin],
      data: {
        labels,
        datasets: [
          line('最高血圧', list.map((r) => r.sys), color('sys'), {
            pointBackgroundColor: list.map((r) => markColor(r.sys, config.warn.sys, config.danger.sys, color('sys'))),
            pointRadius: list.map((r) => markSize(r.sys, config.warn.sys)),
          }),
          line('最低血圧', list.map((r) => r.dia), color('dia'), {
            pointBackgroundColor: list.map((r) => markColor(r.dia, config.warn.dia, config.danger.dia, color('dia'))),
            pointRadius: list.map((r) => markSize(r.dia, config.warn.dia)),
          }),
          line('脈拍', list.map((r) => r.pulse), color('pulse'), { borderWidth: 1.5, pointRadius: dense ? 0 : 2 }),
          baseLine('基準 ' + config.warn.sys, config.warn.sys, color('sys')),
          baseLine('基準 ' + config.warn.dia, config.warn.dia, color('dia')),
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { suggestedMin: 50, suggestedMax: 170, grid: { color: color('line') }, ticks: { color: color('sub') } },
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7, color: color('sub') } },
        },
        plugins: {
          legend: { labels: { boxWidth: 12, font: { size: 11 }, color: color('sub') } },
          tooltip: {
            filter: (item) => item.datasetIndex < 3,
            callbacks: {
              title: (items) => list[items[0].dataIndex].dt + ' ' + list[items[0].dataIndex].cat,
              afterBody: (items) => list[items[0].dataIndex].memo || '',
            },
          },
        },
      },
    };
  }

  // ===== レポートタブ =====
  const reportState = { range: '30' };
  let reportSeq = 0; // 古い読み込み結果で上書きしないための番号
  let reportTitle = '';

  $('reportSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    $('reportSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
    reportState.range = b.dataset.range;
    const custom = reportState.range === 'custom';
    $('customRange').classList.toggle('hidden', !custom);
    if (custom && !$('reportFrom').value) {
      const from = new Date();
      from.setDate(from.getDate() - 29);
      $('reportFrom').value = ymd(from);
      $('reportTo').value = ymd(new Date());
    }
    renderReport();
  });
  ['reportPerson', 'reportFrom', 'reportTo'].forEach((id) => $(id).addEventListener('change', renderReport));

  function reportPeriod() {
    if (reportState.range === 'custom') return { from: $('reportFrom').value, to: $('reportTo').value };
    const from = new Date();
    from.setDate(from.getDate() - (Number(reportState.range) - 1));
    return { from: ymd(from), to: ymd(new Date()) };
  }

  // 1日の朝（または夜）のセル。複数回測った日は平均を出して ※ を付ける
  function slotCell(recs) {
    if (!recs.length) return '<td>—</td>';
    const sys = average(recs.map((r) => r.sys));
    const dia = average(recs.map((r) => r.dia));
    const pulse = average(recs.map((r) => r.pulse));
    const text = sys + '/' + dia + (pulse !== '-' ? ' (' + pulse + ')' : '') + (recs.length > 1 ? '※' : '');
    return '<td class="lv' + level(sys, dia) + '">' + text + '</td>';
  }

  async function renderReport() {
    const seq = ++reportSeq;
    const box = $('report');
    const name = $('reportPerson').value;
    const { from, to } = reportPeriod();
    if (!from || !to || from > to) {
      box.innerHTML = '<p class="empty">期間を正しく選んでください</p>';
      return;
    }
    box.innerHTML = '<p class="empty">読み込み中…</p>';
    let list;
    try {
      list = await call('getRecords', { name, from, to });
    } catch (e) {
      if (seq === reportSeq) box.innerHTML = '<p class="empty">読み込めませんでした：' + esc(e.message) + '</p>';
      return;
    }
    if (seq !== reportSeq) return;

    // 日付ごと・朝夜ごとにまとめる
    const days = [];
    const byDay = {};
    for (let d = new Date(from + 'T00:00'); ymd(d) <= to; d.setDate(d.getDate() + 1)) {
      const key = slash(ymd(d));
      byDay[key] = { '朝': [], '夜': [], label: key.slice(5) + '(' + WEEKDAYS[d.getDay()] + ')' };
      days.push(key);
    }
    list.forEach((r) => {
      const day = byDay[r.dt.slice(0, 10)];
      if (day && day[r.cat]) day[r.cat].push(r);
    });

    const summaryRow = (label, recs) => '<tr><th>' + label + '</th><td>' + average(recs.map((r) => r.sys)) + '</td><td>'
      + average(recs.map((r) => r.dia)) + '</td><td>' + average(recs.map((r) => r.pulse)) + '</td><td>' + recs.length + '</td></tr>';
    const dayRows = days.map((key) => {
      const day = byDay[key];
      const memos = day['朝'].concat(day['夜']).map((r) => r.memo).filter(Boolean);
      return '<tr><th>' + day.label + '</th>' + slotCell(day['朝']) + slotCell(day['夜'])
        + '<td class="memo">' + esc(memos.join('／')) + '</td></tr>';
    }).join('');

    box.innerHTML =
      '<div class="rp-head"><b>家庭血圧記録</b><span>作成日 ' + slash(ymd(new Date())) + '</span></div>'
      + '<div class="rp-sub">' + esc(name) + '　' + slash(from) + '〜' + slash(to) + '（' + days.length + '日間）</div>'
      + '<table class="rp-table"><thead><tr><th></th><th>最高</th><th>最低</th><th>脈拍</th><th>回数</th></tr></thead><tbody>'
      + summaryRow('朝の平均', list.filter((r) => r.cat === '朝'))
      + summaryRow('夜の平均', list.filter((r) => r.cat === '夜'))
      + summaryRow('全体', list)
      + '</tbody></table>'
      + '<div id="reportChart"></div>'
      + '<table class="rp-table"><thead><tr><th style="width:20%">日付</th><th>朝</th><th>夜</th><th style="width:24%">メモ</th></tr></thead>'
      + '<tbody>' + dayRows + '</tbody></table>'
      + '<div class="rp-note"><span class="lv1">黄</span>' + config.warn.sys + '/' + config.warn.dia + '以上　'
      + '<span class="lv2">赤</span>' + config.danger.sys + '/' + config.danger.dia + '以上　'
      + '（ ）内は脈拍　※は同じ時間帯に複数回測った平均　朝＝' + config.boundaryHour + '時より前</div>';

    // グラフは画像にして貼る（印刷やPDFでもきれいに出るように）
    if (list.length) {
      const canvas = document.createElement('canvas');
      canvas.width = 700;
      canvas.height = 260;
      $('reportChart').appendChild(canvas);
      const cfg = chartConfig(list, true);
      Object.assign(cfg.options, { responsive: false, devicePixelRatio: 2 });
      cfg.options.plugins.tooltip = { enabled: false };
      // 画像は白地で使うので、ダークモードでも文字・罫線は明るい背景用の色にする
      // また縮小して表示されるので文字を大きめにする
      const font = { size: 15 };
      cfg.options.plugins.legend.labels = { boxWidth: 14, font, color: '#5f6368' };
      cfg.options.scales.x.ticks = { maxRotation: 0, autoSkip: true, maxTicksLimit: 8, font, color: '#5f6368' };
      cfg.options.scales.y.ticks = { font, color: '#5f6368' };
      cfg.options.scales.y.grid = { color: '#e1e4e8' };
      const c = new Chart(canvas, cfg);
      const img = new Image();
      img.className = 'rp-chart';
      img.alt = '血圧の推移グラフ';
      img.src = c.toBase64Image();
      c.destroy();
      $('reportChart').replaceChildren(img);
    }
    reportTitle = '血圧記録_' + name + '_' + from + '_' + to;
  }

  // 印刷（iPhoneでは印刷画面の共有ボタンからPDFとして保存できる）
  // タイトルをPDFのファイル名に使われるものに一時的に変える
  $('printButton').addEventListener('click', () => {
    const original = document.title;
    if (reportTitle) document.title = reportTitle;
    window.addEventListener('afterprint', () => { document.title = original; }, { once: true });
    window.print();
  });

  init();
</script>
</body>
</html>
